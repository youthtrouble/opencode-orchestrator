name: Remote deploy

# Deploys the Work Trains Worker after the Remote workflow passes on a push to main, or on demand (redeploy or
# roll back). Nothing here names an instance: everything comes from the GitHub environment
# `work-trains-production`. A push in a repository without that environment (a fork, someone else's clone)
# skips with a notice; a manual run there fails, since it asked for a deploy that cannot happen. Setup, token scope and rollback: remote/README.md, "Deploy from GitHub Actions".

on:
  workflow_run:
    workflows: [Remote]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of a commit on main to deploy (empty for the head of main); an older one rolls back
        required: false
        type: string

permissions: {}

concurrency:
  group: work-trains-production
  cancel-in-progress: false

jobs:
  configured:
    # Only a passing Remote run for a push to this repository's main; checking out anything else in this
    # trusted context would run code nobody reviewed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read # GET .../environments/{name}
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      # A job that names a missing environment creates it, so the switch is probed here, outside one.
      - id: probe
        name: Is the work-trains-production environment configured?
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/work-trains-production")
          case $code in
            200) echo "configured=true" >>"$GITHUB_OUTPUT" ;;
            404)
              # A manual run, or a token that may not read the endpoint, must not end green having deployed nothing.
              if [[ $TRIGGER == workflow_dispatch ]]; then
                echo "::error::No work-trains-production environment in this repository (or this run may not read it); remote/README.md, \"Deploy from GitHub Actions\", sets one up."
                exit 1
              fi
              echo "::notice::No work-trains-production environment in this repository, so nothing is deployed. remote/README.md, \"Deploy from GitHub Actions\", sets one up."
              echo "configured=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::Looking up the environment answered HTTP $code"; exit 1 ;;
          esac

  deploy:
    needs: configured
    if: needs.configured.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: work-trains-production
    permissions:
      contents: read
    # The Cloudflare credential is given only to the steps that run wrangler against the account, never to
    # `npm ci`, whose install scripts come from every package in the lockfile.
    env:
      WORK_TRAINS_D1_ID: ${{ vars.WORK_TRAINS_D1_ID }}
      WORK_TRAINS_HOSTNAME: ${{ vars.WORK_TRAINS_HOSTNAME }}
      WORK_TRAINS_WORKERS_DEV: ${{ vars.WORK_TRAINS_WORKERS_DEV }}
      TRIGGER: ${{ github.event_name }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.sha || github.sha) || github.event.workflow_run.head_sha }}
      WRANGLER_SEND_METRICS: 'false'
      # The account's workers.dev subdomain is not a secret Actions knows to mask, so wrangler's output goes
      # through this before it reaches the log.
      HIDE_WORKERS_DEV: 's/[A-Za-z0-9-]+\.[A-Za-z0-9-]+\.workers\.dev/<worker>.<subdomain>.workers.dev/g'
    defaults:
      run:
        shell: bash
        working-directory: remote/worker
    steps:
      # Variables are not masked the way secrets are, and this repository's run logs may be public.
      - name: Check the environment and hide the instance's identifiers
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WORK_TRAINS_D1_ID WORK_TRAINS_HOSTNAME; do
            [[ -n ${!name} ]] || missing="$missing $name"
          done
          if [[ -n $missing ]]; then
            echo "::error::work-trains-production lacks:$missing (remote/README.md, \"Deploy from GitHub Actions\")"
            exit 1
          fi
          echo "::add-mask::$WORK_TRAINS_D1_ID"
          echo "::add-mask::$WORK_TRAINS_HOSTNAME"
          if [[ ! $TARGET_SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The sha input must be a full 40-character commit SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0 # the plan diffs against the commit live now
          persist-credentials: false

      - name: Refuse a commit that is not on main
        run: |
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error::$TARGET_SHA is not on main; only reviewed commits deploy"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26' # runs the TypeScript scripts directly (type stripping)
          package-manager-cache: false

      - name: Install the Worker's dependencies (wrangler pinned by package-lock.json)
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Render wrangler.deploy.jsonc
        run: node scripts/render-deploy-config.ts wrangler.deploy.jsonc

      - id: plan
        name: Plan (skip, or refuse an edited migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy-plan.sh

      - name: Apply D1 migrations
        if: steps.plan.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply work-trains --remote -c wrangler.deploy.jsonc

      - id: deploy
        name: Deploy
        if: steps.plan.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The message records the commit, which the next run's plan reads back.
        run: wrangler deploy -c wrangler.deploy.jsonc --message "$TARGET_SHA" 2>&1 | sed -E "$HIDE_WORKERS_DEV"

      # From here on the new version is live, so any failure rolls it back.
      - id: live
        name: Read the live version
        if: steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          live=$(wrangler deployments status --json -c wrangler.deploy.jsonc | jq -r '[.versions[] | "\(.version_id) (\(.percentage)%)"] | join(", ")')
          echo "live=$live" >>"$GITHUB_OUTPUT"

      - id: smoke
        name: Smoke check (no credentials)
        if: steps.deploy.outcome == 'success'
        run: |
          for attempt in 1 2 3; do
            if node scripts/smoke-check.ts "https://$WORK_TRAINS_HOSTNAME"; then exit 0; fi
            [[ $attempt == 3 ]] || sleep 10
          done
          exit 1

      - name: Roll back after a failure following the deploy
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.plan.outputs.previous_version }}
        run: |
          if [[ -z $PREVIOUS_VERSION ]]; then
            echo "::error::A step after the deploy of $TARGET_SHA failed and there is no single previous version to roll back to; roll back by hand (remote/README.md)"
            exit 1
          fi
          wrangler rollback "$PREVIOUS_VERSION" -c wrangler.deploy.jsonc -y -m "checks failed after deploying $TARGET_SHA" 2>&1 |
            sed -E "$HIDE_WORKERS_DEV"
          echo "::error::A step after the deploy of $TARGET_SHA failed; rolled back to version $PREVIOUS_VERSION. D1 migrations, if any ran, stay applied."

      - name: Summary
        if: always()
        working-directory: .
        env:
          SKIP: ${{ steps.plan.outputs.skip }}
          DEPLOYED_SHA: ${{ steps.plan.outputs.deployed_sha }}
          PREVIOUS_VERSION: ${{ steps.plan.outputs.previous_version }}
          DEPLOY: ${{ steps.deploy.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          LIVE: ${{ steps.live.outputs.live }}
        run: |
          {
            echo "### Work Trains deploy"
            echo "- target: \`$TARGET_SHA\` ($TRIGGER)"
            echo "- live before: commit \`${DEPLOYED_SHA:-unknown}\`, version \`${PREVIOUS_VERSION:-none}\`"
            if [[ $SKIP == true ]]; then echo "- skipped: nothing under remote/worker or remote/protocol changed"; fi
            echo "- deploy: ${DEPLOY:-not run}; smoke check: ${SMOKE:-not run}"
            if [[ -n $LIVE ]]; then echo "- deployed: version $LIVE"; fi
          } >>"$GITHUB_STEP_SUMMARY"
