name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26' # the parity reference for V8's sort (PE-5)
      - run: node --version
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./... && go vet -tags parity ./parity
      - run: go test -count=1 ./...
      - run: ./parity/run.sh --only json,mailbox,manifest,incident,policy
