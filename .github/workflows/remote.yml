name: Remote

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26' # runs the TypeScript sources directly (type stripping)
      - run: node --version
      - name: Protocol contract tests
        run: node --test 'remote/protocol/test/*.test.ts'
      - name: Worker tests and typecheck
        working-directory: remote/worker
        run: |
          npm ci
          npm test
          npm run typecheck

  e2e:
    # The real Worker under `wrangler dev --local` (miniflare, no Cloudflare account) behind a local Access
    # emulator, driven by the real orch: remote/e2e/run.test.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install the Worker's dependencies (wrangler pinned by package-lock.json)
        working-directory: remote/worker
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >>"$GITHUB_PATH"
      - name: End-to-end test
        run: node --test 'remote/e2e/*.test.ts'
